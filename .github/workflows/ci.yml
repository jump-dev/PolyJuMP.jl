name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1', '1.10']
        os: [ubuntu-latest, macOS-latest, windows-latest]
        arch: [default] # x64 for Ubuntu and Windows and aarch64for Mac OS
        include:
          # Also test against 32-bit Linux
          - version: '1'
            os: ubuntu-latest
            arch: x86
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: dev
        shell: julia --project=@. {0}
        run: |
          using Pkg
          Pkg.add([
              PackageSpec(url="https://github.com/blegat/MixedSubdivisions.jl", rev="bl/mp_v0.6"),
              PackageSpec(url="https://github.com/blegat/HomotopyContinuation.jl", rev="sa_refactor"),
          ])
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
